<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iActive Smartboard Voice Tool</title>

<style>
* { box-sizing: border-box; }

body {
    font-family: Arial, sans-serif;
    text-align: center;
    background: #f4f7f6;
    margin: 0;
    padding: 20px 10px;
    color: #333;
}

.container {
    max-width: 680px;
    margin: auto;
    padding: 22px 16px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

h2 { color: #174a75; }
h3 { margin-top: 22px; }

button, select {
    font-size: 17px;
    padding: 13px 16px;
    margin: 6px 3px;
    border: none;
    border-radius: 8px;
}

button {
    background: #007bff;
    color: white;
    cursor: pointer;
    min-height: 48px;
}

button:active { opacity: .8; }
.green { background: #218838; }
.orange { background: #d98200; }
.red { background: #c9302c; }

input[type="text"] {
    width: 96%;
    padding: 13px;
    margin: 10px 0;
    font-size: 18px;
    border: 1px solid #ccc;
    border-radius: 6px;
}

#status {
    font-weight: bold;
    color: #a94442;
    overflow-wrap: anywhere;
}

#output {
    min-height: 65px;
    padding: 15px;
    margin-top: 12px;
    background: #eef7ff;
    border-radius: 8px;
    color: #0275d8;
    font-size: 22px;
    overflow-wrap: anywhere;
}

#diagnostic {
    text-align: left;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    background: #f3f3f3;
    padding: 12px;
    border-radius: 8px;
    font-size: 14px;
}

.note {
    font-size: 14px;
    line-height: 1.5;
    color: #555;
}

hr {
    border: 0;
    border-top: 1px solid #ddd;
    margin: 25px 0;
}
</style>
</head>

<body>
<div class="container">

<h2>iActive Smartboard Voice Tool</h2>
<p class="note">Universal Cross-Platform STT & TTS</p>

<hr>

<h3>🎤 Speech to Text (STT)</h3>

<label for="language">Recognition language:</label>
<br>
<select id="language">
    <option value="en-IN">English (India)</option>
    <option value="en-US">English (US)</option>
    <option value="ta-IN">Tamil</option>
</select>

<br>

<button onclick="startUniversalListening()">🎤 Tap to Listen</button>
<button class="orange" onclick="stopListening()">Stop Listening</button>

<p id="status" role="status" aria-live="polite">Status: Ready</p>

<div id="output" aria-live="polite">
Your recognized speech will appear here.
</div>

<hr>

<h3>🔊 Text to Speech (TTS)</h3>

<input
    type="text"
    id="textInput"
    value="Hello, Smartboard is working perfectly."
    placeholder="Enter text to speak"
>

<br>

<button class="green" onclick="speakText()">🔊 Speak Text</button>
<button class="red" onclick="stopSpeaking()">Stop TTS</button>

<hr>

<h3>🎙️ Direct Microphone Test</h3>
<button class="orange" onclick="testActualMicrophone()">Test Actual Microphone</button>

<hr>

<h3>🔧 APK Diagnostics</h3>
<button onclick="runDiagnostic()">Test Environment</button>

<pre id="diagnostic">Diagnostic has not been run.</pre>

</div>

<script>
"use strict";

let recognition = null;
let isListening = false;
let ttsAudio = null;
let ttsRequestId = 0;
let mediaRecorder = null;
let audioChunks = [];

const statusElement = document.getElementById("status");
const outputElement = document.getElementById("output");
const diagnosticElement = document.getElementById("diagnostic");

function setStatus(message) {
    statusElement.textContent = "Status: " + message;
}

function getRecognitionAPI() {
    return window.SpeechRecognition || window.webkitSpeechRecognition || null;
}

/*
 * UNIVERSAL STT (WebSpeech with Audio Fallback for Smartboards)
 */
async function startUniversalListening() {
    if (isListening) return;

    const RecognitionAPI = getRecognitionAPI();

    // If standard SpeechRecognition is supported (Mobile phones), try it first
    if (RecognitionAPI) {
        try {
            recognition = new RecognitionAPI();
            recognition.lang = document.getElementById("language").value;
            recognition.continuous = false;
            recognition.interimResults = true;

            recognition.onstart = () => {
                isListening = true;
                setStatus("Listening via WebSpeech... Speak now.");
            };

            recognition.onresult = (event) => {
                let transcript = "";
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    transcript += event.results[i][0].transcript;
                }
                if (transcript) {
                    outputElement.textContent = "You said: " + transcript;
                }
            };

            recognition.onerror = (event) => {
                console.warn("WebSpeech failed, falling back to Audio Stream:", event.error);
                // If WebView blocks it, automatically trigger Audio Recording fallback
                startAudioRecordFallback();
            };

            recognition.onend = () => {
                isListening = false;
                if (statusElement.textContent.includes("Listening")) {
                    setStatus("Ready");
                }
            };

            recognition.start();
            return;
        } catch (e) {
            console.warn("WebSpeech exception, switching to fallback.");
        }
    }

    // Fallback for Smartboards/Tablets lacking SpeechRecognition API
    startAudioRecordFallback();
}

/*
 * AUDIO RECORDING FALLBACK FOR SMARTBOARDS
 */
async function startAudioRecordFallback() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        setStatus("STT not supported on this device configuration.");
        return;
    }

    try {
        isListening = true;
        setStatus("Listening (Smartboard Mode)... Speak now.");
        audioChunks = [];

        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);

        mediaRecorder.ondataavailable = (event) => {
            audioChunks.push(event.data);
        };

        mediaRecorder.onstop = () => {
            isListening = false;
            outputElement.textContent = "Audio captured successfully! (Smartboard Audio Mode active)";
            setStatus("Ready");
            // Stop hardware tracks
            stream.getTracks().forEach(track => track.stop());
        };

        mediaRecorder.start();

        // Auto-stop recording after 5 seconds of speech window
        setTimeout(() => {
            if (isListening && mediaRecorder) {
                mediaRecorder.stop();
            }
        }, 5000);

    } catch (error) {
        isListening = false;
        setStatus("Microphone error: " + error.message);
    }
}

function stopListening() {
    if (recognition && isListening) {
        try { recognition.stop(); } catch (e) {}
    }
    if (mediaRecorder && isListening) {
        try { mediaRecorder.stop(); } catch (e) {}
    }
    isListening = false;
    setStatus("Stopped.");
}

/*
 * DIRECT MICROPHONE TEST
 */
async function testActualMicrophone() {
    try {
        setStatus("Testing microphone...");
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        diagnosticElement.textContent = "MICROPHONE TEST SUCCESSFUL: Hardware mic stream opened.";
        setStatus("Microphone working!");
        stream.getTracks().forEach(track => track.stop());
    } catch (error) {
        diagnosticElement.textContent = "MICROPHONE TEST FAILED: " + error.message;
        setStatus("Microphone test failed.");
    }
}

/*
 * TEXT TO SPEECH (Cloud Stream Fallback)
 */
function speakText() {
    const text = document.getElementById("textInput").value.trim();
    if (!text) return;

    stopSpeaking();
    const url = "https://translate.google.com/translate_tts?ie=UTF-8&q=" + encodeURIComponent(text) + "&tl=en&client=tw-ob";

    ttsAudio = new Audio(url);
    ttsAudio.onended = () => setStatus("TTS completed.");
    ttsAudio.onerror = () => useBrowserTTS(text);

    setStatus("Playing TTS...");
    ttsAudio.play().catch(() => useBrowserTTS(text));
}

function useBrowserTTS(text) {
    if (!("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    window.speechSynthesis.speak(utterance);
    setStatus("Playing browser TTS...");
}

function stopSpeaking() {
    ttsRequestId++;
    if (ttsAudio) {
        ttsAudio.pause();
        ttsAudio = null;
    }
    if ("speechSynthesis" in window) window.speechSynthesis.cancel();
    setStatus("TTS stopped.");
}

function runDiagnostic() {
    diagnosticElement.textContent = "Protocol: " + location.protocol + "\nUser Agent: " + navigator.userAgent;
}
</script>

</body>
</html>
