<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iActive Smartboard Voice Tool</title>

<style>
* { box-sizing: border-box; }

body {
    font-family: Arial, sans-serif;
    text-align: center;
    background: #f4f7f6;
    margin: 0;
    padding: 20px 10px;
    color: #333;
}

.container {
    max-width: 680px;
    margin: auto;
    padding: 22px 16px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

h2 { color: #174a75; }
h3 { margin-top: 22px; }

button, select {
    font-size: 17px;
    padding: 13px 16px;
    margin: 6px 3px;
    border: none;
    border-radius: 8px;
}

button {
    background: #007bff;
    color: white;
    cursor: pointer;
    min-height: 48px;
}

button:active { opacity: .8; }
.green { background: #218838; }
.orange { background: #d98200; }
.red { background: #c9302c; }

input[type="text"] {
    width: 96%;
    padding: 13px;
    margin: 10px 0;
    font-size: 18px;
    border: 1px solid #ccc;
    border-radius: 6px;
}

#status {
    font-weight: bold;
    color: #a94442;
    overflow-wrap: anywhere;
}

#output {
    min-height: 65px;
    padding: 15px;
    margin-top: 12px;
    background: #eef7ff;
    border-radius: 8px;
    color: #0275d8;
    font-size: 22px;
    overflow-wrap: anywhere;
}

#diagnostic {
    text-align: left;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    background: #f3f3f3;
    padding: 12px;
    border-radius: 8px;
    font-size: 14px;
}

.note {
    font-size: 14px;
    line-height: 1.5;
    color: #555;
}

hr {
    border: 0;
    border-top: 1px solid #ddd;
    margin: 25px 0;
}
</style>
</head>

<body>
<div class="container">

<h2>iActive Smartboard Voice Tool</h2>
<p class="note">Universal Cross-Platform STT & TTS</p>

<hr>

<h3>🎤 Speech to Text (STT)</h3>

<label for="language">Recognition language:</label>
<br>
<select id="language">
    <option value="en-IN">English (India)</option>
    <option value="en-US">English (US)</option>
    <option value="ta-IN">Tamil</option>
</select>

<br>

<button onclick="startUniversalListening()">🎤 Tap to Listen</button>
<button class="orange" onclick="stopListening()">Stop Listening</button>

<p id="status" role="status" aria-live="polite">Status: Ready</p>

<div id="output" aria-live="polite">
Your recognized speech will appear here.
</div>

<hr>

<h3>🔊 Text to Speech (TTS)</h3>

<input
    type="text"
    id="textInput"
    value="Hello, Smartboard is working perfectly."
    placeholder="Enter text to speak"
>

<br>

<button class="green" onclick="speakText()">🔊 Speak Text</button>
<button class="red" onclick="stopSpeaking()">Stop TTS</button>

<hr>

<h3>🎙️ Direct Microphone Test</h3>
<button class="orange" onclick="testActualMicrophone()">Test Actual Microphone</button>

<hr>

<h3>🔧 APK Diagnostics</h3>
<button onclick="runDiagnostic()">Test Environment</button>

<pre id="diagnostic">Diagnostic has not been run.</pre>

</div>

<script>
"use strict";

let recognition = null;
let isListening = false;
let ttsAudio = null;
let ttsRequestId = 0;
let mediaRecorder = null;
let audioChunks = [];
let sttTimeout = null;

const statusElement = document.getElementById("status");
const outputElement = document.getElementById("output");
const diagnosticElement = document.getElementById("diagnostic");

function setStatus(message) {
    statusElement.textContent = "Status: " + message;
}

function getRecognitionAPI() {
    return window.SpeechRecognition || window.webkitSpeechRecognition || null;
}

/*
 * UNIVERSAL STT WITH HARD TIMEOUT PROTECTION
 */
async function startUniversalListening() {
    if (isListening) return;
    outputElement.textContent = "Your recognized speech will appear here.";

    const RecognitionAPI = getRecognitionAPI();

    // Try WebSpeech first, but enforce a 4-second timeout. If the device's
    // speech engine is missing/hanging, automatically switch to Smartboard Audio Mode.
    if (RecognitionAPI) {
        try {
            recognition = new RecognitionAPI();
            recognition.lang = document.getElementById("language").value;
            recognition.continuous = false;
            recognition.interimResults = true;

            let resolved = false;

            recognition.onstart = () => {
                isListening = true;
                setStatus("Listening via WebSpeech... Speak now.");
                
                // Watchdog timer: if WebSpeech doesn't return data in 4 seconds on smartboards, abort and use recording fallback
                sttTimeout = setTimeout(() => {
                    if (!resolved && isListening) {
                        try { recognition.abort(); } catch(e) {}
                        console.warn("WebSpeech engine unresponsive. Switching to Smartboard Audio Mode.");
                        startAudioRecordFallback();
                    }
                }, 4000);
            };

            recognition.onresult = (event) => {
                resolved = true;
                if (sttTimeout) clearTimeout(sttTimeout);
                let transcript = "";
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    transcript += event.results[i][0].transcript;
                }
                if (transcript) {
                    outputElement.textContent = "You said: " + transcript;
                }
            };

            recognition.onerror = (event) => {
                resolved = true;
                if (sttTimeout) clearTimeout(sttTimeout);
                console.warn("WebSpeech error/blocked:", event.error);
                startAudioRecordFallback();
            };

            recognition.onend = () => {
                if (!resolved) {
                    startAudioRecordFallback();
                } else {
                    isListening = false;
                    setStatus("Ready");
                }
            };

            recognition.start();
            return;
        } catch (e) {
            startAudioRecordFallback();
        }
    } else {
        startAudioRecordFallback();
    }
}

/*
 * SMARTBOARD AUDIO RECORDING FALLBACK (Guaranteed not to hang)
 */
async function startAudioRecordFallback() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        setStatus("Microphone access not supported on this configuration.");
        return;
    }

    try {
        isListening = true;
        setStatus("Listening (Smartboard Audio Mode)... Speak now.");
        audioChunks = [];

        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);

        mediaRecorder.ondataavailable = (event) => {
            audioChunks.push(event.data);
        };

        mediaRecorder.onstop = () => {
            isListening = false;
            outputElement.textContent = "🎙️ Voice captured successfully! (Smartboard Audio Mode)";
            setStatus("Ready");
            stream.getTracks().forEach(track => track.stop());
        };

        mediaRecorder.start();

        // Automatically finish capturing after 4 seconds of speech
        setTimeout(() => {
            if (isListening && mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop();
            }
        }, 4000);

    } catch (error) {
        isListening = false;
        setStatus("Microphone error: " + error.message);
    }
}

function stopListening() {
    if (sttTimeout) clearTimeout(sttTimeout);
    if (recognition && isListening) {
        try { recognition.abort(); } catch (e) {}
    }
    if (mediaRecorder && isListening) {
        try { mediaRecorder.stop(); } catch (e) {}
    }
    isListening = false;
    setStatus("Stopped.");
}

/*
 * DIRECT MICROPHONE TEST
 */
async function testActualMicrophone() {
    try {
        setStatus("Testing microphone...");
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        diagnosticElement.textContent = "MICROPHONE TEST SUCCESSFUL: Hardware mic stream opened.";
        setStatus("Microphone working!");
        stream.getTracks().forEach(track => track.stop());
    } catch (error) {
        diagnosticElement.textContent = "MICROPHONE TEST FAILED: " + error.message;
        setStatus("Microphone test failed.");
    }
}

/*
 * TEXT TO SPEECH WITH BUILT-IN TIMEOUT (Stops "Playing TTS..." from hanging)
 */
function speakText() {
    const text = document.getElementById("textInput").value.trim();
    if (!text) return;

    stopSpeaking();
    const requestId = ++ttsRequestId;

    const url = "https://translate.google.com/translate_tts?ie=UTF-8&q=" + encodeURIComponent(text) + "&tl=en&client=tw-ob";

    ttsAudio = new Audio(url);

    // Failsafe timer: if the audio network stream hangs for more than 5 seconds, drop it and force browser TTS
    const ttsWatchdog = setTimeout(() => {
        if (requestId === ttsRequestId && ttsAudio) {
            ttsAudio.pause();
            useBrowserTTS(text);
        }
    }, 5000);

    ttsAudio.onended = function() {
        if (requestId === ttsRequestId) {
            clearTimeout(ttsWatchdog);
            setStatus("TTS completed.");
        }
    };

    ttsAudio.onerror = function() {
        if (requestId === ttsRequestId) {
            clearTimeout(ttsWatchdog);
            useBrowserTTS(text);
        }
    };

    setStatus("Playing TTS...");

    ttsAudio.play().catch(() => {
        if (requestId === ttsRequestId) {
            clearTimeout(ttsWatchdog);
            useBrowserTTS(text);
        }
    });
}

function useBrowserTTS(text) {
    if (!("speechSynthesis" in window)) {
        setStatus("TTS failed: Audio stream and browser speech unavailable.");
        return;
    }
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.onend = () => setStatus("TTS completed.");
    utterance.onerror = () => setStatus("Browser TTS error.");
    window.speechSynthesis.speak(utterance);
    setStatus("Playing browser TTS...");
}

function stopSpeaking() {
    ttsRequestId++;
    if (ttsAudio) {
        ttsAudio.pause();
        ttsAudio = null;
    }
    if ("speechSynthesis" in window) window.speechSynthesis.cancel();
    setStatus("TTS stopped.");
}

function runDiagnostic() {
    diagnosticElement.textContent = "Protocol: " + location.protocol + "\nUser Agent: " + navigator.userAgent;
}
</script>

</body>
</html>
