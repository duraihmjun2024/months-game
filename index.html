<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smartboard Voice Diagnostic Tool</title>
<style>
* { box-sizing: border-box; }
body {
    font-family: system-ui, -apple-system, sans-serif;
    text-align: center;
    background: #0f172a;
    color: #f8fafc;
    margin: 0;
    padding: 20px;
}
.container {
    max-width: 750px;
    margin: auto;
    padding: 30px;
    background: #1e293b;
    border-radius: 16px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}
h1 { color: #38bdf8; margin-top: 0; font-size: 1.8rem; }
h2 { color: #94a3b8; font-size: 1.2rem; border-bottom: 2px solid #334155; padding-bottom: 8px; margin-top: 25px; }
button, select, input {
    font-size: 18px;
    padding: 15px 20px;
    margin: 8px 4px;
    border: none;
    border-radius: 10px;
    outline: none;
}
button {
    background: #3b82f6;
    color: white;
    cursor: pointer;
    font-weight: 600;
    min-height: 56px;
    transition: opacity 0.2s, transform 0.1s;
}
button:active { transform: scale(0.98); opacity: 0.8; }
.btn-green { background: #22c55e; }
.btn-orange { background: #f59e0b; }
.btn-red { background: #ef4444; }

input[type="text"] {
    width: 100%;
    background: #0f172a;
    color: white;
    border: 1px solid #475569;
    font-size: 18px;
    margin-bottom: 10px;
}
select {
    background: #0f172a;
    color: white;
    border: 1px solid #475569;
    width: 100%;
    margin-bottom: 10px;
}
#status {
    font-weight: bold;
    color: #facc15;
    background: #334155;
    padding: 12px;
    border-radius: 8px;
    margin: 15px 0;
    font-size: 1.1rem;
}
#output {
    min-height: 70px;
    padding: 18px;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 10px;
    color: #38bdf8;
    font-size: 1.4rem;
    font-weight: bold;
    word-break: break-word;
}
.note { font-size: 0.95rem; color: #94a3b8; line-height: 1.4; }
</style>
</head>
<body>

<div class="container">
    <h1>🏫 Smartboard Voice & Audio Center</h1>
    <p class="note">Designed for IActive Smartboards & Tablets to test cloud TTS and Web Speech STT safely.</p>

    <div id="status">Status: Ready to test</div>

    <!-- STT SECTION -->
    <h2>🎤 Speech-to-Text (STT) Test</h2>
    <label for="language">Select Recognition Language:</label>
    <select id="language">
        <option value="en-IN">English (India)</option>
        <option value="en-US">English (US)</option>
        <option value="ta-IN">Tamil</option>
    </select>
    
    <div>
        <button class="btn-green" onclick="startSmartSTT()">🎙️ Tap & Speak</button>
        <button class="btn-orange" onclick="stopSmartSTT()">⏹️ Stop</button>
    </div>
    <div id="output">Your spoken words will appear here...</div>

    <!-- TTS SECTION -->
    <h2>🔊 Text-to-Speech (TTS) Test</h2>
    <input type="text" id="textInput" value="Hello! Smartboard text to speech is working perfectly." placeholder="Type text here...">
    <div>
        <button class="btn-green" onclick="playSmartTTS()">🔊 Play TTS</button>
        <button class="btn-red" onclick="stopSmartTTS()">🔇 Stop TTS</button>
    </div>

    <!-- DIAGNOSTIC SECTION -->
    <h2>🔧 Hardware Diagnostic</h2>
    <button class="btn-orange" onclick="runDiagnostics()">Run Environment Check</button>
</div>

<script>
"use strict";

const statusEl = document.getElementById("status");
const outputEl = document.getElementById("output");
let recognition = null;
let isListening = false;
let ttsAudio = null;
let ttsId = 0;
let sttTimeout = null;

function setStatus(msg) {
    statusEl.textContent = "Status: " + msg;
}

// --- STT ENGINE ---
function startSmartSTT() {
    const SpeechAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechAPI) {
        setStatus("Error: SpeechRecognition API not supported in this environment.");
        outputEl.textContent = "[Not Supported]";
        return;
    }

    if (isListening) stopSmartSTT();

    try {
        recognition = new SpeechAPI();
        recognition.lang = document.getElementById("language").value;
        recognition.continuous = false;
        recognition.interimResults = true;
        recognition.maxAlternatives = 1;

        let speechCaptured = false;

        recognition.onstart = () => {
            isListening = true;
            setStatus("Listening... Speak clearly into the microphone.");
            outputEl.textContent = "Listening...";

            // 5-second watchdog timer to prevent smartboard UI freezes if speech services time out
            sttTimeout = setTimeout(() => {
                if (!speechCaptured && isListening) {
                    try { recognition.abort(); } catch(e) {}
                    isListening = false;
                    setStatus("Timeout: No speech captured or engine unresponsive.");
                    outputEl.textContent = "[Timeout - Try Again]";
                }
            }, 5000);
        };

        recognition.onresult = (event) => {
            speechCaptured = true;
            if (sttTimeout) clearTimeout(sttTimeout);
            let transcript = "";
            for (let i = event.resultIndex; i < event.results.length; i++) {
                transcript += event.results[i][0].transcript;
            }
            if (transcript) {
                outputEl.textContent = transcript;
            }
        };

        recognition.onerror = (event) => {
            speechCaptured = true;
            if (sttTimeout) clearTimeout(sttTimeout);
            isListening = false;
            setStatus("STT Error: " + event.error);
            outputEl.textContent = "[Error: " + event.error + "]";
        };

        recognition.onend = () => {
            isListening = false;
            if (!speechCaptured) {
                setStatus("Listening ended.");
            } else {
                setStatus("Recognition complete.");
            }
        };

        recognition.start();
    } catch (err) {
        isListening = false;
        setStatus("Initialization Error: " + err.message);
    }
}

function stopSmartSTT() {
    if (sttTimeout) clearTimeout(sttTimeout);
    if (recognition && isListening) {
        try { recognition.abort(); } catch(e) {}
    }
    isListening = false;
    setStatus("Stopped listening.");
}

// --- TTS ENGINE ---
function playSmartTTS() {
    const text = document.getElementById("textInput").value.trim();
    if (!text) {
        alert("Please enter text to speak.");
        return;
    }

    stopSmartTTS();
    const currentId = ++ttsId;

    // Cloud MP3 streaming endpoint bypasses missing local OS voice packs
    const audioUrl = "https://translate.google.com/translate_tts?ie=UTF-8&q=" + encodeURIComponent(text) + "&tl=en&client=tw-ob";
    ttsAudio = new Audio(audioUrl);

    // Watchdog timer to ensure audio streaming never hangs on "Playing..."
    const watchdog = setTimeout(() => {
        if (currentId === ttsId && ttsAudio) {
            ttsAudio.pause();
            fallbackBrowserTTS(text);
        }
    }, 6000);

    ttsAudio.onended = () => {
        if (currentId === ttsId) {
            clearTimeout(watchdog);
            setStatus("TTS playback completed successfully.");
        }
    };

    ttsAudio.onerror = () => {
        if (currentId === ttsId) {
            clearTimeout(watchdog);
            fallbackBrowserTTS(text);
        }
    };

    setStatus("Streaming cloud TTS audio...");
    ttsAudio.play().catch(() => {
        if (currentId === ttsId) {
            clearTimeout(watchdog);
            fallbackBrowserTTS(text);
        }
    });
}

function fallbackBrowserTTS(text) {
    if (!("speechSynthesis" in window)) {
        setStatus("TTS Failed: Both cloud audio and browser synthesis unavailable.");
        return;
    }
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.onend = () => setStatus("Browser TTS completed.");
    utterance.onerror = () => setStatus("Browser TTS playback error.");
    window.speechSynthesis.speak(utterance);
    setStatus("Fallback: Playing browser system TTS...");
}

function stopSmartTTS() {
    ttsId++;
    if (ttsAudio) {
        try { ttsAudio.pause(); ttsAudio.currentTime = 0; } catch(e) {}
        ttsAudio = null;
    }
    if ("speechSynthesis" in window) {
        try { window.speechSynthesis.cancel(); } catch(e) {}
    }
    setStatus("TTS stopped.");
}

// --- DIAGNOSTICS ---
function runDiagnostics() {
    const hasSpeech = !!(window.SpeechRecognition || window.webkitSpeechRecognition);
    const hasMedia = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
    const isSecure = window.isSecureContext;
    
    alert(
        "Smartboard Diagnostic Results:\n\n" +
        "• Protocol: " + location.protocol + "\n" +
        "• Secure Context (HTTPS): " + (isSecure ? "YES" : "NO") + "\n" +
        "• SpeechRecognition API: " + (hasSpeech ? "SUPPORTED" : "UNSUPPORTED") + "\n" +
        "• MediaDevices/Mic API: " + (hasMedia ? "AVAILABLE" : "UNAVAILABLE")
    );
    setStatus("Diagnostic completed.");
}
</script>

</body>
</html>
