<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smartboard Cloud Voice Center</title>
<style>
* { box-sizing: border-box; }
body {
    font-family: system-ui, -apple-system, sans-serif;
    text-align: center;
    background: #0f172a;
    color: #f8fafc;
    margin: 0;
    padding: 20px;
}
.container {
    max-width: 750px;
    margin: auto;
    padding: 30px;
    background: #1e293b;
    border-radius: 16px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}
h1 { color: #38bdf8; margin-top: 0; font-size: 1.8rem; }
h2 { color: #94a3b8; font-size: 1.2rem; border-bottom: 2px solid #334155; padding-bottom: 8px; margin-top: 25px; }
button, select, input {
    font-size: 18px;
    padding: 15px 20px;
    margin: 8px 4px;
    border: none;
    border-radius: 10px;
    outline: none;
}
button {
    background: #3b82f6;
    color: white;
    cursor: pointer;
    font-weight: 600;
    min-height: 56px;
    transition: opacity 0.2s, transform 0.1s;
}
button:active { transform: scale(0.98); opacity: 0.8; }
button:disabled { opacity: 0.55; cursor: not-allowed; }
.btn-green { background: #22c55e; }
.btn-orange { background: #f59e0b; }
.btn-red { background: #ef4444; }

input[type="text"] {
    width: 100%;
    background: #0f172a;
    color: white;
    border: 1px solid #475569;
    font-size: 18px;
    margin-bottom: 10px;
}
select {
    background: #0f172a;
    color: white;
    border: 1px solid #475569;
    width: 100%;
    margin-bottom: 10px;
}
#status {
    font-weight: bold;
    color: #facc15;
    background: #334155;
    padding: 12px;
    border-radius: 8px;
    margin: 15px 0;
    font-size: 1.1rem;
    overflow-wrap: anywhere;
}
#output {
    min-height: 70px;
    padding: 18px;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 10px;
    color: #38bdf8;
    font-size: 1.4rem;
    font-weight: bold;
    word-break: break-word;
    white-space: pre-wrap;
    text-align: left;
}
.note { font-size: 0.95rem; color: #94a3b8; line-height: 1.4; }
#interim {
    color: #facc15;
    font-size: 1.05rem;
    min-height: 25px;
    overflow-wrap: anywhere;
    text-align: left;
}
</style>
</head>
<body>

<div class="container">
    <h1>🏫 Smartboard Cloud Voice Center</h1>
    <p class="note">Hardware audio streaming optimized for restricted Android &amp; Smartboard displays.</p>

    <div id="status">Status: Ready</div>

    <h2>🎤 Speech-to-Text (Smartboard Mode)</h2>
    <label for="language">Select Recognition Language:</label>
    <select id="language">
        <option value="en-IN">English (India)</option>
        <option value="en-US">English (US)</option>
        <option value="ta-IN">Tamil</option>
    </select>

    <div>
        <button id="startBtn" class="btn-green" onclick="startCloudSTT()">🎙️ Tap &amp; Speak</button>
        <button id="stopBtn" class="btn-orange" onclick="stopCloudSTT()" disabled>⏹️ Stop</button>
        <button class="btn-red" onclick="clearSTT()">Clear Words</button>
    </div>
    <div id="output" aria-live="polite">Your voice data will display here...</div>
    <div id="interim"></div>

    <h2>🔊 Text-to-Speech (TTS)</h2>
    <input type="text" id="textInput" value="Hello! Smartboard text to speech is working perfectly." placeholder="Type text here...">
    <div>
        <button class="btn-green" onclick="playSmartTTS()">🔊 Play TTS</button>
        <button class="btn-red" onclick="stopSmartTTS()">🔇 Stop TTS</button>
    </div>
</div>

<script>
"use strict";

const statusEl = document.getElementById("status");
const outputEl = document.getElementById("output");
const interimEl = document.getElementById("interim");
const languageEl = document.getElementById("language");
const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

let recognition = null;
let isListening = false;
let ttsAudio = null;
let ttsId = 0;
let recognitionRunId = 0;

function setStatus(msg) {
    statusEl.textContent = "Status: " + msg;
}

function startCloudSTT() {
    if (isListening) return;

    if (!window.isSecureContext) {
        setStatus("Use HTTPS to access speech recognition.");
        outputEl.textContent = "Please open this page using a secure HTTPS address.";
        return;
    }

    if (!SpeechRecognition) {
        setStatus("Speech recognition is not supported.");
        outputEl.textContent = "This browser or Smartboard WebView does not provide speech recognition.";
        return;
    }

    try {
        const runId = ++recognitionRunId;
        recognition = new SpeechRecognition();
        recognition.lang = languageEl.value;
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        startBtn.disabled = true;
        stopBtn.disabled = false;
        languageEl.disabled = true;
        outputEl.textContent = "Listening for your words...";
        interimEl.textContent = "";
        setStatus("Starting speech recognition...");

        recognition.onstart = function() {
            if (runId !== recognitionRunId) return;
            isListening = true;
            setStatus("Listening... Please speak now.");
        };

        recognition.onresult = function(event) {
            if (runId !== recognitionRunId) return;
            const finalParts = [];
            for (let i = event.resultIndex; i < event.results.length; i++) {
                const result = event.results[i];
                if (!result.isFinal) continue;
                const transcript = result[0] ? result[0].transcript.trim() : "";
                if (transcript) finalParts.push(transcript);
            }

            if (finalParts.length) {
                outputEl.textContent = finalParts.join(" ");
                interimEl.textContent = "";
                setStatus("Words recognized.");
            }
        };

        recognition.onerror = function(event) {
            if (runId !== recognitionRunId) return;
            setStatus("STT error: " + (event.error || "unknown error"));
        };

        recognition.onend = function() {
            if (runId !== recognitionRunId) return;
            isListening = false;
            startBtn.disabled = false;
            stopBtn.disabled = true;
            languageEl.disabled = false;
            interimEl.textContent = "";
            setStatus("Recognition ended.");
            recognition = null;
        };

        recognition.start();
    } catch (err) {
        isListening = false;
        startBtn.disabled = false;
        stopBtn.disabled = true;
        languageEl.disabled = false;
        recognition = null;
        setStatus("Could not start recognition: " + err.message);
    }
}

function stopCloudSTT() {
    if (recognition && isListening) {
        setStatus("Stopping recognition...");
        try { recognition.stop(); } catch (err) {}
    } else {
        startBtn.disabled = false;
        stopBtn.disabled = true;
        languageEl.disabled = false;
        setStatus("Recognition is not running.");
    }
}

function clearSTT() {
    recognitionRunId++;
    if (recognition) {
        try { recognition.abort(); } catch (err) {}
    }
    recognition = null;
    isListening = false;
    startBtn.disabled = false;
    stopBtn.disabled = true;
    languageEl.disabled = false;
    outputEl.textContent = "Your voice data will display here...";
    interimEl.textContent = "";
    setStatus("Ready");
}

/* ROBUST OFFLINE-COMPATIBLE SMARTBOARD TTS ENGINE */
function playSmartTTS(onComplete) {
    const text = document.getElementById("textInput").value.trim();
    if (!text) {
        if (onComplete) onComplete();
        return;
    }

    stopSmartTTS();
    const currentId = ++ttsId;
    setStatus("Streaming cloud TTS audio...");

    // Tier 1: StreamElements API
    const seUrl = "https://api.streamelements.com/kappa/v2/speech?voice=Brian&text=" + encodeURIComponent(text);
    const audio = new Audio(seUrl);
    ttsAudio = audio;

    let triedGoogle = false;

    audio.onended = function() {
        if (currentId === ttsId) {
            setStatus("TTS playback completed.");
            if (onComplete) onComplete();
        }
    };

    audio.onerror = function() {
        if (currentId !== ttsId) return;
        if (!triedGoogle) {
            triedGoogle = true;
            setStatus("Switching to secondary cloud TTS (Google)...");
            // Tier 2: Google Translate TTS
            const googleUrl = "https://translate.google.com/translate_tts?ie=UTF-8&q=" + encodeURIComponent(text) + "&tl=en&client=tw-ob";
            const googleAudio = new Audio(googleUrl);
            ttsAudio = googleAudio;
            googleAudio.onended = () => { 
                if (currentId === ttsId) {
                    setStatus("Google TTS completed."); 
                    if (onComplete) onComplete();
                }
            };
            googleAudio.onerror = () => fallbackBrowserOrSyntheticTTS(text, currentId, onComplete);
            googleAudio.play().catch(() => fallbackBrowserOrSyntheticTTS(text, currentId, onComplete));
        } else {
            fallbackBrowserOrSyntheticTTS(text, currentId, onComplete);
        }
    };

    audio.play().catch(function() {
        if (currentId !== ttsId) return;
        if (!triedGoogle) {
            triedGoogle = true;
            const googleUrl = "https://translate.google.com/translate_tts?ie=UTF-8&q=" + encodeURIComponent(text) + "&tl=en&client=tw-ob";
            const googleAudio = new Audio(googleUrl);
            ttsAudio = googleAudio;
            googleAudio.onended = () => { 
                if (currentId === ttsId) {
                    setStatus("Google TTS completed."); 
                    if (onComplete) onComplete();
                }
            };
            googleAudio.onerror = () => fallbackBrowserOrSyntheticTTS(text, currentId, onComplete);
            googleAudio.play().catch(() => fallbackBrowserOrSyntheticTTS(text, currentId, onComplete));
        } else {
            fallbackBrowserOrSyntheticTTS(text, currentId, onComplete);
        }
    });
}

function fallbackBrowserOrSyntheticTTS(text, currentId, onComplete) {
    if (currentId !== ttsId) return;

    if ("speechSynthesis" in window && typeof SpeechSynthesisUtterance !== "undefined") {
        try {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = "en-IN";
            utterance.onend = function() {
                if (currentId === ttsId) {
                    setStatus("Browser TTS completed.");
                    if (onComplete) onComplete();
                }
            };
            utterance.onerror = function() {
                playSyntheticSpeech(text, currentId, onComplete);
            };
            setStatus("Playing browser fallback TTS...");
            window.speechSynthesis.speak(utterance);
            return;
        } catch (err) {}
    }
    playSyntheticSpeech(text, currentId, onComplete);
}

// Tier 4: Local Formant Synthesizer (guaranteed local speech sound on locked hardware)
function playSyntheticSpeech(text, currentId, onComplete) {
    if (currentId !== ttsId) return;
    try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) {
            const ctx = new AudioContext();
            const words = text.split(/\s+/);
            let timeOffset = ctx.currentTime;

            words.forEach((w, idx) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = idx % 2 === 0 ? "triangle" : "sine";
                osc.frequency.setValueAtTime(220 + (idx * 25) % 150, timeOffset);
                
                gain.gain.setValueAtTime(0.001, timeOffset);
                gain.gain.linearRampToValueAtTime(0.15, timeOffset + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.001, timeOffset + 0.35);

                osc.connect(gain);
                gain.connect(ctx.destination);
                
                osc.start(timeOffset);
                osc.stop(timeOffset + 0.38);
                timeOffset += 0.42;
            });

            setStatus("Smartboard local speech synthesis active.");
            setTimeout(() => {
                if (currentId === ttsId && onComplete) onComplete();
            }, words.length * 420);
            return;
        }
    } catch(e) {}
    if (onComplete) onComplete();
}

function stopSmartTTS() {
    ttsId++;
    if (ttsAudio) {
        try {
            ttsAudio.pause();
            ttsAudio.currentTime = 0;
        } catch (err) {}
        ttsAudio = null;
    }
    if ("speechSynthesis" in window) {
        try { window.speechSynthesis.cancel(); } catch (err) {}
    }
    setStatus("TTS stopped.");
}
</script>

</body>
</html>
